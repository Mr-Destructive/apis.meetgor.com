openapi: "3.1.0"
info:
  title: Shared Components
  version: 1.0.0

components:
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
    NewsletterSummary:
      type: object
      description: |
        A compact summary of a newsletter entry. Includes metadata
        and a short description, but omits the full markdown content
        to keep list responses fast and lightweight.
      required:
        - id
        - title
        - link
        - pub_date
        - slug
      properties:
        id:
          type: integer
          description: Database-generated unique identifier.
          example: 1
        title:
          type: string
          description: The newsletter issue title.
          example: Techstructive Weekly #97
        link:
          type: string
          format: uri
          description: |
            The permanent URL of the newsletter on meetgor.com.
          example: https://www.meetgor.com/newsletter/techstructive-weekly-97
        description:
          type: string
          description: |
            A short, plain-text description of the issue content.
            Useful for previews, cards, and SEO meta tags.
          example: Read about OpenAPI specifications, watched a few livestreams...
        type:
          type: string
          description: Content type tag from the RSS feed.
          example: newsletter
        pub_date:
          type: string
          description: |
            Publication date as provided by the RSS feed (RFC 2822 format).
          example: Fri, 05 Jun 2026 00:00:00 UTC
        slug:
          type: string
          description: |
            URL-friendly identifier extracted from the link. Use this
            with `GET /my/newsletter/{slug}` to fetch the full entry.
          example: techstructive-weekly-97

    NewsletterFull:
      type: object
      description: |
        A complete newsletter entry with the full markdown content
        included. This is what you get from the single-item lookup
        endpoint.
      allOf:
        - $ref: "#/components/schemas/NewsletterSummary"
        - type: object
          properties:
            content:
              type: string
              description: |
                The full markdown body of the newsletter. Includes
                headings, links, blockquotes, lists, images, and
                all the formatting from the original post.
              example: "## Week #97\n\nIt was a great week..."
            created_at:
              type: string
              description: |
                Timestamp of when this entry was first inserted into
                the database (ISO 8601 format).
              example: "2026-06-06 12:00:56"

    GoodreadsBookSummary:
      type: object
      description: |
        A compact Goodreads bookshelf entry from the public RSS feed.
        This is the lightweight shape used by `/my/books`.
      required:
        - title
        - link
        - slug
        - book_id
        - author_name
        - user_rating
        - user_shelves
      properties:
        title:
          type: string
        link:
          type: string
          format: uri
        slug:
          type: string
        book_id:
          type: string
        author_name:
          type: string
        book_image_url:
          type: string
          format: uri
        average_rating:
          type: string
        user_rating:
          type: string
        user_read_at:
          type: string
        user_date_added:
          type: string
        user_shelves:
          type: string
        shelves:
          type: array
          items:
            type: string

    GoodreadsBookReview:
      allOf:
        - $ref: "#/components/schemas/GoodreadsBookSummary"
        - type: object
          properties:
            book_description:
              type: string
            isbn:
              type: string
            user_review:
              type: string
            review:
              type: string
            book_published:
              type: string
            num_pages:
              type: string
            user_name:
              type: string
            user_date_created:
              type: string
            book_small_image_url:
              type: string
              format: uri
            book_medium_image_url:
              type: string
              format: uri
            book_large_image_url:
              type: string
              format: uri

    BlogPostSummary:
      type: object
      description: |
        A blog entry from the public RSS feed, used for thoughts and
        links-style posts.
      required:
        - title
        - link
        - slug
        - pub_date
        - section
      properties:
        title:
          type: string
        link:
          type: string
          format: uri
        content:
          type: string
        description:
          type: string
        pub_date:
          type: string
        slug:
          type: string
        section:
          type: string
          enum:
            - thoughts
            - links
            - posts
            - other

    BlogQuerySearch:
      type: object
      description: |
        Advanced search configuration with control over match mode
        and which fields to search.
      properties:
        query:
          type: string
          description: The search terms.
          example: "typescript rust"
        mode:
          type: string
          enum:
            - all
            - any
          default: all
          description: |
            `all` requires every term to match (AND); `any` returns
            posts matching at least one term (OR).
        fields:
          type: array
          description: Which fields to search. Defaults to all text fields.
          items:
            type: string
            enum:
              - title
              - description
              - content

    BlogQuerySort:
      type: object
      description: |
        Sort specification for ordering the query results.
      properties:
        field:
          type: string
          enum:
            - pub_date
            - title
          description: The field to sort by.
        order:
          type: string
          enum:
            - asc
            - desc
          default: desc
          description: Sort direction.

    BlogQueryDate:
      type: object
      description: Date range filter for blog posts.
      properties:
        from:
          type: string
          format: date
          description: Include posts published on or after this date (ISO 8601).
          example: "2025-01-01"
        to:
          type: string
          format: date
          description: Include posts published on or before this date (ISO 8601).
          example: "2025-12-31"

    BlogQuery:
      type: object
      description: |
        The JSON body for a QUERY request to `/my/blogs`. Every field
        is optional — omitting all filters returns all posts paginated.
      properties:
        search:
          oneOf:
            - type: string
              description: Simple case-insensitive substring search across title, description, and content.
            - $ref: "#/components/schemas/BlogQuerySearch"
          description: |
            When a string, performs a case-insensitive substring match
            across all text fields. When an object, enables advanced
            multi-term and field-scoped search.
          example: "typescript"
        section:
          type: string
          enum:
            - thoughts
            - links
            - posts
            - other
          description: Filter posts to a specific section.
        date:
          $ref: "#/components/schemas/BlogQueryDate"
        sort:
          $ref: "#/components/schemas/BlogQuerySort"
        limit:
          type: integer
          default: 10
          maximum: 100
          description: Maximum number of posts to return.
        offset:
          type: integer
          default: 0
          description: Number of posts to skip for pagination.
        fields:
          type: array
          description: |
            Restrict the response to only these fields. Useful for
            reducing response size when you only need specific data.
          items:
            type: string
            enum:
              - title
              - link
              - content
              - description
              - pub_date
              - slug
              - section
      example:
        search:
          query: "typescript rust"
          mode: "any"
          fields:
            - title
            - description
        section: posts
        date:
          from: "2025-01-01"
          to: "2025-12-31"
        sort:
          field: pub_date
          order: desc
        limit: 20
        offset: 0
        fields:
          - title
          - slug
          - pub_date
          - section

    SocialLink:
      type: object
      description: |
        A single entry in the personal link tree.
      required:
        - name
        - handle
        - url
      properties:
        name:
          type: string
        handle:
          type: string
        url:
          type: string
          format: uri

    BlogrollEntry:
      type: object
      description: |
        A curated external blog feed selected from the posts I have
        linked to or highlighted on the site.
      required:
        - name
        - site
        - feed
        - source
      properties:
        name:
          type: string
        site:
          type: string
          format: uri
        feed:
          type: string
          format: uri
        source:
          type: string
          format: uri
        note:
          type: string

    DocletFileInfo:
      type: object
      required:
        - name
        - mimeType
        - size
        - extension
      properties:
        name:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        extension:
          type: string

    DocletInspection:
      type: object
      required:
        - file
        - kind
        - metadata
        - supportedActions
      properties:
        file:
          $ref: "#/components/schemas/DocletFileInfo"
        kind:
          type: string
          description: Detected document kind.
        metadata:
          type: object
          additionalProperties: true
        supportedActions:
          type: array
          items:
            type: string

    DocletCapability:
      type: object
      required:
        - action
        - description
        - kinds
        - supported
      properties:
        action:
          type: string
        description:
          type: string
        kinds:
          type: array
          items:
            type: string
        supported:
          type: boolean

    DocletIntent:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          description: The operation to apply.
        params:
          type: object
          additionalProperties: true
        outputName:
          type: string

    DocletOperationResult:
      type: object
      properties:
        name:
          type: string
        inspection:
          $ref: "#/components/schemas/DocletInspection"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/DocletCapability"

    Board:
      type: object
      description: |
        The complete state of a Tic Tac Toe game at a given moment.
        The client is responsible for persisting this between moves
        and sending it back with each POST request.
      required:
        - board
        - turn
        - winner
        - draw
      properties:
        board:
          type: array
          items:
            type: array
            items:
              type:
                - string
                - "null"
          description: |
            A 3x3 matrix representing the board. Each cell is either
            `null` (empty), `"X"`, or `"O"`. The outer array
            represents rows; the inner arrays represent columns.
        turn:
          type: string
          description: |
            Whose turn it is next. Use this value as your `player`
            field in the next POST request.
          example: O
        winner:
          type:
            - string
            - "null"
          description: |
            The symbol of the winning player, or `null` if the
            game is still in progress or ended in a draw.
          example: X
        draw:
          type: boolean
          description: |
            Whether the game ended in a draw. If `true`, all nine
            cells are filled and no player has three in a row.
          example: false
      example:
        board:
          - ["X", "O", "X"]
          - ["O", "X", "O"]
          - ["X", "O", "X"]
        turn: O
        winner: X
        draw: false

    Flight:
      type: object
      description: |
        A single aircraft state vector from the OpenSky Network. All
        position fields (lat, lon, altitude, velocity, heading) may be
        null if the aircraft has not recently transmitted position data.
      required:
        - timestamp
        - icao24
        - callsign
        - airline
        - origin_country
        - on_ground
        - airport
      properties:
        timestamp:
          type: string
          format: date-time
          description: When this state was observed by the pipeline
        icao24:
          type: string
          description: ICAO 24-bit transponder address (hex)
          example: "80162c"
        callsign:
          type: string
          description: Flight callsign (e.g. AXB1253)
          example: "AXB1253"
        airline:
          type: string
          description: Resolved airline name
          example: "Air India Express"
        origin_country:
          type: string
          description: Country associated with the aircraft's ICAO address
          example: "India"
        lat:
          type: number
          format: double
          nullable: true
          description: WGS-84 latitude (decimal degrees)
        lon:
          type: number
          format: double
          nullable: true
          description: WGS-84 longitude (decimal degrees)
        altitude:
          type: number
          format: double
          nullable: true
          description: Barometric altitude in meters
        on_ground:
          type: boolean
          description: Whether the aircraft is on the ground
        velocity:
          type: number
          format: double
          nullable: true
          description: Ground speed in m/s
        heading:
          type: number
          format: double
          nullable: true
          description: True track heading in degrees from north (0-360)
        airport:
          type: string
          description: Nearest airport ICAO code
          example: "VIDP"

    FlightQueryBbox:
      type: object
      description: Geographic bounding box filter
      required:
        - south
        - west
        - north
        - east
      properties:
        south:
          type: number
          format: double
          description: Southern latitude bound (-90 to 90)
          example: 18.5
        west:
          type: number
          format: double
          description: Western longitude bound (-180 to 180)
          example: 72.5
        north:
          type: number
          format: double
          description: Northern latitude bound (-90 to 90)
          example: 19.5
        east:
          type: number
          format: double
          description: Eastern longitude bound (-180 to 180)
          example: 73.5

    FlightQueryRange:
      type: object
      description: A numeric range filter with optional min and/or max
      properties:
        min:
          type: number
          description: Lower bound (inclusive)
        max:
          type: number
          description: Upper bound (inclusive)

    FlightQuerySort:
      type: object
      description: Sort specification for ordering results
      properties:
        field:
          type: string
          enum:
            - altitude
            - velocity
            - heading
            - callsign
            - airline
            - timestamp
          description: The field to sort by
        order:
          type: string
          enum:
            - asc
            - desc
          default: desc
          description: Sort direction

    FlightQuery:
      type: object
      description: |
        The JSON body for a QUERY request to `/flights`. Every field
        is optional. The more filters you specify, the more targeted
        your results.

        Compare this to the equivalent GET query string:

        ```
        ?callsign=AXB&airline=Air+India&altitude.min=3000&altitude.max=12000&speed.min=100&bbox.south=18.5&bbox.north=19.5&bbox.west=72.5&bbox.east=73.5&on_ground=false&sort.field=altitude&sort.order=desc&limit=50&fields=callsign,airline,altitude,lat,lon
        ```

        The QUERY version is cleaner, avoids URL encoding issues, and
        keeps sensitive or complex filter logic out of server logs.
      properties:
        callsign:
          type: string
          description: Substring match on flight callsign
          example: "AXB"
        airline:
          type: string
          description: Substring match on airline name
          example: "Air India"
        country:
          type: string
          description: Substring match on origin country
          example: "India"
        airport:
          type: string
          description: Exact match on nearest airport ICAO code
          example: "VIDP"
        search:
          type: string
          description: Full-text search across callsign, airline, country, and airport
          example: "Air India DEL"
        altitude:
          $ref: "#/components/schemas/FlightQueryRange"
          description: Filter by barometric altitude range (meters)
        speed:
          $ref: "#/components/schemas/FlightQueryRange"
          description: Filter by ground speed range (m/s)
        heading:
          $ref: "#/components/schemas/FlightQueryRange"
          description: Filter by heading range (degrees from north)
        bbox:
          $ref: "#/components/schemas/FlightQueryBbox"
          description: Geographic bounding box filter
        on_ground:
          type: boolean
          description: Filter by ground/airborne status
        sort:
          $ref: "#/components/schemas/FlightQuerySort"
        limit:
          type: integer
          default: 50
          maximum: 500
          description: Maximum flights to return
        offset:
          type: integer
          default: 0
          description: Number of flights to skip
        fields:
          type: array
          description: Restrict response to only these fields
          items:
            type: string
            enum:
              - timestamp
              - icao24
              - callsign
              - airline
              - origin_country
              - lat
              - lon
              - altitude
              - on_ground
              - velocity
              - heading
              - airport
      example:
        callsign: "AXB"
        airline: "Air India"
        altitude:
          min: 3000
          max: 12000
        speed:
          min: 100
        bbox:
          south: 18.5
          west: 72.5
          north: 19.5
          east: 73.5
        on_ground: false
        sort:
          field: altitude
          order: desc
        limit: 20
        offset: 0
        fields:
          - callsign
          - airline
          - altitude
          - lat
          - lon
